[package]
name = "havn-channel-telegram"
version = "0.2.11"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "havn channel adapter for Telegram — bridges Telegram Bot API ↔ havn gateway WebSocket protocol (spec §3)."
repository = "https://github.com/amplimit/havn-channel-telegram"
homepage = "https://github.com/amplimit/havn-channel-telegram"
authors = ["Amplimit <oss@amplimit.com>"]

[[bin]]
name = "havn-channel-telegram"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "query", "http2", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
